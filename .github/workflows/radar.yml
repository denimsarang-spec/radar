name: radar

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 평일 17:00 KST (UTC 월~금 08:00), 장 마감 후 종가 기준. Actions 지연 있을 수 있음
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul            # date.today()가 KST 기준이 되도록
      PYTHONIOENCODING: utf-8
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: radar
        run: python -W ignore radar.py

      - name: 소스 로그
        if: always()
        run: cat data/radar.log 2>/dev/null || echo "(로그 없음)"

      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/ data/*.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "radar $(date +%F)"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
