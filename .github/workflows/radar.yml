name: radar

# 공개 페이지는 내렸다. 이 파일을 푸시하면 안내 페이지로 덮어쓴다.
# 저녁 수집은 PC 작업(RadarLive)이 자리 잡을 때까지만 유지하며 페이지에는 배포하지 않는다.
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 평일 19:30 KST (UTC 월~금 10:30)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/radar.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul            # date.today()가 KST 기준이 되도록
      PYTHONIOENCODING: utf-8
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: radar
        run: python -W ignore radar.py

      - name: 소스 로그
        if: always()
        run: cat data/radar.log 2>/dev/null || echo "(로그 없음)"

      - name: 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/ data/*.json
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "radar $(date +%F)"
          # 푸시와 겹칠 수 있다. out/ 충돌은 방금 만든 쪽을 택한다
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

  takedown:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 안내 페이지 생성
        run: |
          mkdir site
          printf '%s' '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Closed</title></head><body><p>This page is no longer published.</p></body></html>' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: takedown
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
